name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref so pushes don't pile up long builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  lint-test-linux:
    name: Clippy & Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            libasound2-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: ASRTU-1 telemetry tables
        # Guard the hand-maintained tables: the generator must still reproduce
        # tm_tables.c from the sheets, and both C checks (a synthetic self-test
        # and an independent re-parse that cross-checks every field) must pass.
        run: |
          cd soundmodem
          python3 tools/gen_tm_tables.py ASRTU-1 > /tmp/tm_tables.gen.c
          diff -u csrc/tm_tables.c /tmp/tm_tables.gen.c
          clang -std=c99 -Wall -Wextra -Werror -Icsrc \
            csrc/tm_decode.c csrc/tm_tables.c test/tm_selftest.c -lm -o /tmp/tm_selftest
          clang -std=c99 -Wall -Wextra -Werror -Icsrc \
            csrc/tm_decode.c csrc/tm_tables.c test/tm_verify.c -lm -o /tmp/tm_verify
          /tmp/tm_selftest
          /tmp/tm_verify ASRTU-1

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
