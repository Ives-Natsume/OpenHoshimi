name: Release

on:
  push:
    tags: ["v*"]
  # Allow building distributable artifacts on demand without cutting a tag.
  # A GitHub Release is only created for tag pushes (see the `release` job).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: closedhoshimi-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: closedhoshimi-windows-x86_64

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      - name: Build release binaries
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          -p openhoshimi-app -p decode_file -p sat_tool

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release
          out=dist/${{ matrix.artifact }}
          mkdir -p "$out"
          for b in closedhoshimi decode_file sat_tool; do
            strip "$bin/$b"
            cp "$bin/$b" "$out/"
          done
          cp -r satellites "$out/"
          cp LICENSE README "$out/"
          tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C dist "${{ matrix.artifact }}"
          ( cd dist && sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256" )

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release"
          $out = "dist/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($b in "closedhoshimi.exe", "decode_file.exe", "sat_tool.exe") {
            Copy-Item "$bin/$b" $out/
          }
          Copy-Item -Recurse satellites $out/
          Copy-Item LICENSE, README $out/
          $zip = "dist/${{ matrix.artifact }}.zip"
          Compress-Archive -Path $out -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.artifact }}.zip" |
            Out-File -Encoding ascii "$zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
